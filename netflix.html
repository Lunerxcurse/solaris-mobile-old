<style>
  body { background-color: #000000; }

  /* Responsive grid for movie cards:
     - grid auto-fills columns with a minimum size so we get ~2/3/4 columns depending on viewport */
  #grid.grid, .grid {
    display: grid;
    gap: 6px;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    align-items: start;
  }

  /* Tweak breakpoints for denser/larger layouts */
  @media (min-width: 900px) {
    #grid.grid, .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  }
  @media (min-width: 1200px) {
    #grid.grid, .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
  }

  /* Make poster cards adapt to the grid cell (smaller sizes like homepage) */
  .poster-card, .movie-card-placeholder {
    width: 100% !important;
    min-width: 0 !important;
    aspect-ratio: 2 / 3;
    border-radius: 8px;
    overflow: hidden;
    background: linear-gradient(180deg, rgba(38,38,38,0.4) 0%, rgba(20,20,20,0.8) 100%);
    border: 1px solid rgba(255,255,255,0.05);
    transition: transform 0.18s ease-in-out, box-shadow 0.18s ease-in-out;
    display: block;
    max-width: 160px; /* cap so cards match homepage density */
  }
  .poster-card img, .movie-card-placeholder img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .poster-card:active, .movie-card-placeholder:active {
    border-color: #E50914;
    transform: scale(0.98);
  }

  /* ensure the grid is responsive within any scroll wrapper */
  .grid-wrap { overflow: auto; }

</style>

<!-- BottomNavBar Semantic Shell - Suppressed because this feels like a focused/transactional search or sub-category flow initiated by the back arrow context in the header, not the top level home. -->

<script>
(async function(){
  const TMDB_KEY = 'b15142dfa85e41840fcd4ab30d82488f';
  const TMDB_IMG = p => p ? ('https://image.tmdb.org/t/p/w500'+p) : '/no-image-available.png';
  const grid = document.getElementById('grid');
  const loader = document.getElementById('loader');

  let page = 1;
  let loading = false;
  let ended = false;
  const seenIds = new Set();
  const SAFETY_CAP = 1000;

  async function fetchDiscoverPage(p){
    const url = new URL('https://api.themoviedb.org/3/discover/movie');
    url.searchParams.set('api_key', TMDB_KEY);
    url.searchParams.set('language', 'en-US');
    url.searchParams.set('sort_by', 'popularity.desc');
    url.searchParams.set('page', String(p));
    try {
      const r = await fetch(url);
      if(!r.ok) throw new Error('HTTP '+r.status);
      return await r.json();
    } catch (e) {
      console.warn('fetchDiscoverPage error', e);
      return null;
    }
  }

  function createCard(item){
    const id = String(item.id || '');
    if(!id || seenIds.has(id)) return null;
    const title = item.title || item.name || '';
    const posterSrc = TMDB_IMG(item.poster_path || item.backdrop_path);
    const wrapper = document.createElement('div');
    wrapper.className = 'poster-card relative min-w-[100px] w-[130px] aspect-[2/3] rounded-lg overflow-hidden snap-start flex-shrink-0 group cursor-pointer';
    wrapper.dataset.tmdb = id;
    wrapper.tabIndex = 0;
    wrapper.setAttribute('role','listitem');

    const img = document.createElement('img');
    img.alt = title;
    img.src = posterSrc;
    img.className = 'poster-img';
    img.onerror = function(){ if(!this._tried){ this._tried = true; this.src = '/no-image.png'; } };
    wrapper.appendChild(img);

    const caption = document.createElement('div');
    caption.className = 'absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-end p-2';
    caption.innerHTML = `<span class="text-sm text-white line-clamp-1">${title}</span>`;
    wrapper.appendChild(caption);

    wrapper.addEventListener('click', () => {
      // deep-link to index with tmdb param so the main app can resolve to details
      try {
        location.href = `/index.html?tmdb=${encodeURIComponent(id)}&type=movie`;
      } catch(e){ console.warn(e); }
    });

    seenIds.add(id);
    return wrapper;
  }

  async function loadBatch(pagesToFetch = 1, targetAppend = 24){
    if(loading || ended) return 0;
    loading = true;
    loader.textContent = 'Loading...';
    let added = 0;
    for(let i=0; i<pagesToFetch && !ended; i++){
      if(grid.children.length >= SAFETY_CAP) { ended = true; break; }
      const res = await fetchDiscoverPage(page);
      page++;
      if(!res || !Array.isArray(res.results) || res.results.length === 0){
        ended = true; break;
      }
      for(const it of res.results){
        if(added >= targetAppend) break;
        const card = createCard(it);
        if(card){ grid.appendChild(card); added++; }
      }
      await new Promise(r=>setTimeout(r, 80));
    }
    loading = false;
    loader.textContent = ended ? (grid.children.length ? '' : 'No results') : '';
    return added;
  }

  async function loadMore(){
    if(loading || ended) return;
    let totalAdded = 0;
    while(totalAdded < 16 && !ended){
      const a = await loadBatch(1, 16);
      if(!a) break;
      totalAdded += a;
      if(grid.children.length >= SAFETY_CAP) break;
    }
  }

  // initial warm load
  (async function warm(){
    try {
      await loadBatch(3, 48);
      if(grid.children.length < 40) await loadBatch(2, 40);
      setTimeout(()=> { if(!loading && !ended) loadMore(); }, 300);
    } catch(e){ console.warn(e); }
  })();

  // infinite scroll: when near bottom load more
  const gridWrapEl = document.querySelector('.grid-wrap');
  function onScroll(e){
    try {
      const el = gridWrapEl || document.scrollingElement || document.documentElement;
      const bottom = el.scrollTop + (el.clientHeight || window.innerHeight);
      if(bottom >= (el.scrollHeight - 600)) loadMore();
    } catch(err){}
  }
  (gridWrapEl || window).addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', () => {
    if(document.body.offsetHeight < window.innerHeight * 1.2) loadMore();
  });

  window.addEventListener('load', ()=> setTimeout(()=> {
    const first = grid.querySelector('.poster-card');
    if(first) try{ first.focus(); }catch(e){}
  }, 250));
})();
</script>
